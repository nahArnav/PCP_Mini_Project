spring.application.name=digital-wallet
server.address=127.0.0.1
server.port=8080
# File storage survives restarts. Start only one app instance per database file.
spring.datasource.url=jdbc:h2:file:./data/wallet;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=${WALLET_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
